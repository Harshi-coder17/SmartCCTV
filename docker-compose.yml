version: "3.9"

services:
  # PostgreSQL database (production path)
  db:
    image: postgres:16-alpine
    container_name: smartcctv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcctv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-smartcctv_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcctv} -d ${POSTGRES_DB:-smartcctv_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcctv_net

  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcctv_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartcctv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartcctv_db}
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      JWT_ALGORITHM: RS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      EVIDENCE_DIR: /app/evidence
      MODELS_DIR: /app/models_cache
      YOLO_MODEL: yolov8n.pt
      REID_MODEL: osnet_x0_25
      FACE_BACKEND: ${FACE_BACKEND:-haar}
      USE_GPU: ${USE_GPU:-False}
      ANALYTICS_FPS: ${ANALYTICS_FPS:-5}
      CAMERA_HEALTH_INTERVAL_SECS: 5
      REID_SIMILARITY_THRESHOLD: 0.75
      REID_MARGIN_THRESHOLD: 0.10
      LOITERING_THRESHOLD_SECS: 30
      ABANDONED_OBJECT_THRESHOLD_SECS: 60
      HASH_LEDGER_PATH: /app/logs/hash_ledger.db
      AUDIT_LOG_PATH: /app/logs/audit.log
      HASH_LEDGER_BACKEND: sqlite
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:80"]'
    volumes:
      - ./evidence:/app/evidence
      - ./models_cache:/app/models_cache
      - ./logs:/app/logs
      - ./keys:/app/keys
      - ./data:/app/data:ro
      - ./video.mp4:/app/video.mp4:ro
      - ./video2.mp4:/app/video2.mp4:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smartcctv_net

  # Frontend (production build served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: smartcctv_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - smartcctv_net

volumes:
  postgres_data:
    driver: local

networks:
  smartcctv_net:
    driver: bridge
